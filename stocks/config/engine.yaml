# stocks-claw 引擎配置
# 优先级：环境变量 > 本文件 > 代码默认值
# 嵌套环境变量使用双下划线，如 STOCKS_FETCHER__MAX_RETRIES=3

paths:
  # 配置目录，默认相对 stocks/ 包目录
  config_dir: null
  # 数据目录
  data_dir: null
  # 本地隐私数据目录（不提交 git）
  local_data_dir: null
  # 密钥目录
  secret_dir: null
  # 全局情报存储目录
  intelligence_dir: null

providers:
  # base_url 可在环境变量 STOCKS_PROVIDER_<NAME>_BASE_URL 覆盖
  # A 股行情 Provider
  tencent_a:
    enabled: true
    base_url: https://qt.gtimg.cn
  eastmoney_a:
    enabled: true
    base_url: https://push2.eastmoney.com
  # 美股/加密货币 Provider
  finnhub:
    enabled: true
    base_url: https://finnhub.io/api/v1
  binance:
    enabled: true
    base_url: https://api.binance.com/api/v3
  # 备用 Provider 映射：市场 -> [备用1, 备用2]
  fallback:
    a:
      - eastmoney_a
      - tencent_a
    us:
      - polygon
    crypto:
      - binance

fetcher:
  # 主 Provider 失败后的重试次数
  max_retries: 1
  # 重试间隔（秒）
  retry_delay: 1.0

cache:
  # 启用本地缓存
  enabled: true
  # 历史数据保留期（秒，90 天）
  history_ttl: 7776000
  # 历史缓存目录；默认写入 .local/history，避免污染源码目录
  history_dir: null
  # 保留最大快照数
  max_snapshots: 30
  # build_context 成功后保存最小化快照
  save_to_file: true

macro:
  # 启用宏观数据采集（FRED 主源 → Yahoo 备源 → static_config 兜底）
  enabled: true
  # 静态配置兜底（离线时使用）
  static_config:
    # vix: 20.0
    # usd_cny: 7.25
    # us_10y_yield: 4.2

calendar:
  # 启用官方宏观日程与 watchlist 美股财报日历
  enabled: true
  lookahead_days: 14
  earnings:
    enabled: true

filings:
  # 仅查询 watchlist：SEC 8-K/10-Q/10-K 与巨潮公告
  enabled: true
  sec:
    enabled: true
  cninfo:
    enabled: true

news:
  # 为 watchlist 动态生成 Google News RSS 定向源
  watchlist_templates_enabled: true

llm:
  # LLM 深度分析模块（投资建议生成）— 建议由 Agent 主脑处理，此处可禁用
  analysis_enabled: false
  # 2026-08-12: kimi-k2.6 → deepseek-v4-flash — 与 .secret/openai-key.md
  # (deepseek) 匹配。此前 kimi-k2.6 对 deepseek 端点 400/401 → LLM 分析
  # 每次失败回退规则 → 信号层 0 信号(与 8-11 三断链同族)。
  analysis_model: deepseek-v4-flash
  # API Key 从环境变量读取，也可通过 .secret/openai-key.md
  # 注意: 容器运行环境注入的 OPENAI_API_KEY 是旧端点凭据，不可用；
  # 强制走 .secret 文件(openai-key.md / openai-base-url.md)避免 env 覆盖。
  api_key_env: STOCKS_LLM_UNUSED_API_KEY
  base_url_env: STOCKS_LLM_UNUSED_BASE_URL
  # 报告渲染 LLM（scripts/run_llm_report.py 消费）
  report_render:
    base_url: "http://172.16.248.60:8000/v1"   # NAS 本地 vllm
    model: "DeepSeek-V4-Flash"
    api_key: "EMPTY"
    timeout_seconds: 180
    max_attempts: 3            # 渲染失败自动重试次数（含首次）
  # 中长期研判综合器
  outlook:
    enabled: true
    # 2026-08-13: 主模型 deepseek-v4-pro -> deepseek-v4-flash。
    # 319KB 大 snapshot prompt 下 v4-pro 响应 >300s 超时(advisory synthesis
    # 连续失败);flash 更快,适配大 prompt 研判。flash 失败时兜底 v4-pro。
    model: deepseek-v4-flash
    # 主模型失败（超时/传输/解析错误）时按顺序尝试的备用模型，
    # 与主模型共用同一端点和密钥
    fallback_models: ["deepseek-v4-pro"]
    # 每个模型的额外重试次数（0=不重复，1=失败后重试一次）
    retry_attempts: 1
    # 凭据改走 .secret/openai-key.md 与 openai-base-url.md(容器 env 不注入,
    # 避免运行时容器 env 中的旧端点/旧 key 覆盖)
    api_key_env: STOCKS_OUTLOOK_UNUSED_API_KEY
    base_url_env: STOCKS_OUTLOOK_UNUSED_BASE_URL
    # 留空=未配置；必须通过 OPENAI_COMPATIBLE_BASE_URL 或 .secret/openai-base-url.md 提供
    fallback_base_url: ""
    # 单次 LLM 研判调用上限。DeepSeek 官方 API 对超长 snapshot(>100KB)
    # 响应约 160s,需留足余量,否则稳定触发 urllib timeout。
    timeout_seconds: 300
    temperature: 0.2
    max_tokens: 5000
    cache_dir: .local/outlook_cache

execution_rules:
  # Ordered, explicit production execution rules. First matching rule wins.
  settlement_rules:
    - id: cash-t0
      match: {liquidity_tier: cash}
      settlement_rule: T+0
    - id: liquid-t0
      match: {liquidity_tier: t0}
      settlement_rule: T+0
    - id: brokerage-t1
      match: {institution_type: brokerage, liquidity_tier: t1}
      settlement_rule: T+1
    - id: fund-platform-t2
      match: {institution_type: fund_platform, liquidity_tier: t2_plus}
      settlement_rule: T+2
    - id: bank-periodic-open
      match: {institution_type: bank, liquidity_tier: periodic_open}
      settlement_rule: periodic_open
    - id: insurance-locked
      match: {institution_type: insurance, liquidity_tier: locked}
      settlement_rule: locked
  quantity_rules:
    - id: a-brokerage-add-lot
      match: {market: a, institution_type: brokerage, side: add}
      quantity_step: 100
    - id: a-brokerage-reduce-share
      match: {market: a, institution_type: brokerage, side: reduce}
      quantity_step: 1
    - id: us-brokerage-share
      match: {market: us, institution_type: brokerage}
      quantity_step: 1
    - id: fund-platform-share
      match: {institution_type: fund_platform}
      quantity_step: 0.01
    - id: bank-gram
      match: {institution_type: bank, product_type: precious_metal_account}
      quantity_step: 0.01
  redemption_rule_map: {}

quant_action:
  # ── 持仓管理阈值（long 基准表，唯一权威。代码与 computed_profile 均无副本）──
  # 以下值为当前生产真实生效值（2026-08-22 从 computed_profile 提级为基准，
  # 源自 Kari 左侧画像：容忍更深回撤、更早止盈、更勤回踩加仓）。
  defaults:
    stop_loss_pct: -18.0           # 硬止损线（左侧容忍深回撤）
    mid_stop_pct: -14.0            # 中间减仓线
    mid_stop_ratio: 0.3            # 中间减仓比例
    warning_loss_pct: -10.0        # 浮亏警告线（加仓上限）
    take_profit_levels: [[8.0, 0.3], [20.0, 0.3], [35.0, 0.4]]  # 止盈阶梯（左侧见好就收）
    profit_pullback_pct: -2.5      # 高浮盈单日回撤锁利线
    profit_pullback_min_pnl: 5.0   # 锁利最低浮盈门槛
    trend_ma20_break_cutoff: 0.99  # 跌破 MA20 判定系数
    trend_break_ladder: [[0.99, 0.3], [0.97, 0.5], [0.94, 0.75], [0.88, 1.0]]
    default_position_limit_pct: 5.0
    trend_confirmed_limit_pct: 10.0
    left_add_max_rsi: 60.0         # 左侧加仓 RSI 上限
    left_add_min_rsi: 40.0         # 左侧加仓 RSI 下限
    ma20_pullback_add_ratios: [0.03, 0.05, 0.08]  # 回踩 MA20 分批加仓阶梯
    trend_break_extra_deviation_pct: 1.0
    # 左侧状态画像降级：趋势跌破+深跌超卖 → 降级为持有观察
    left_state_degrade_enabled: true
    left_state_rsi_max: 35.0
    left_state_drawdown_max: -40.0
    left_state_bollinger_lower: true
    # 高置信加仓（高胜率重仓变现）
    high_conviction_evidence_threshold: 0.7
    high_conviction_add_ratio: 0.05
    high_conviction_limit_pct: 15.0
    # 引擎内部打分/邻域常量（2026-08-22 从代码提级）
    technical_evidence:
      trend_break: 0.90            # 趋势破位信号置信度
      take_profit: 0.75            # 止盈信号置信度
      pullback_add: 0.55           # 回踩加仓信号置信度
    near_ma20_band: [0.97, 1.03]   # MA20 邻域判定（回踩±3%）
    trend_break_reduce_ratio: 0.25 # 单档破位减仓比例
    max_total_reduce_ratio: 0.75   # 多档破位累计减仓上限
    recency_weights: {fresh: 1.0, stale: 0.75, delayed: 0.5, error: 0.3}

  # ── 短线(swing)持仓覆盖表（horizon=swing 时覆盖 defaults）──
  swing_overrides:
    stop_loss_pct: -8.0
    mid_stop_pct: -6.0
    warning_loss_pct: -4.0
    profit_pullback_pct: -1.5
    profit_pullback_min_pnl: 2.0
    left_state_degrade_enabled: false

  # ── 研究信号阈值表（action_signals._signal_for_item 消费）──
  thresholds:
    knife_r5: -3.0                 # 5根K线跌幅视为加速下跌
    knife_rsi: 38.0
    reduce_r20: -5.0               # 20根跌幅视为趋势转弱
    pullback_r20: 5.0              # 趋势强劲阈值
    pullback_rsi: 65.0
    pullback_position: 85.0        # 布林位置百分比
    accumulate_r20: 2.0
    accumulate_rsi_low: 40.0
    accumulate_rsi_high: 65.0
    accumulate_r20_max: 15.0       # 短期涨幅过高应等回调
    left_bottom_rsi_max: 40.0
    left_bottom_price_position_max: 25.0
    left_bottom_r20_max: -10.0
    left_bottom_r5_floor: -5.0
    left_bottom_pullback_cooldown: 0.02

  # ── 轮动横截面排序权重 ──
  rank_weights:
    r20: 0.40
    rsi_zone: 0.30
    price_pos: 0.20
    volume: 0.10

  # ── 信号文案表（action_signals 消费：action_hint / sizing_hint / conflict_hint）──
  signal_text:
    action_hints:
      accumulate_candidate: "趋势完好且回踩确认，可建仓/加仓；分批布局优先于一次性重仓"
      left_bottom_candidate: "深跌超卖且跌势放缓，左侧轻仓试仓，跌破前低或 RSI 持续恶化则止损"
      wait_for_pullback: "趋势完好但短线过热，等回踩确认再进，不追"
      reduce_risk: "趋势与动能同步转弱，优先降低该标的暴露"
      avoid_catching_falling_knife: "下跌未止，任何补仓等收盘重新站回短均线再说"
      rotation_candidate: "相对强弱领先，若与组合缺口匹配可作为轮入候选"
      neutral_hold: "无明确方向信号，维持现状，等待新信号"
      no_data: "历史或指标不足，本轮不给方向"
    sizing_hints:
      left_bottom_candidate: "轻仓试仓（建议占组合不超过1-3%）；止损：跌破触发前低或20日低点继续下移"
      accumulate_candidate: "趋势回踩建仓机会（首仓建议占组合2-4%，确认企稳后可加至5-8%）；止损：跌破MA20且MACD柱转负，或跌破建仓日低点"
      rotation_candidate: "仅在组合有对应缺口时轮入（建议占组合不超过1-3%）；止损：轮动排名掉出前3或趋势破MA20"
      wait_for_pullback: "等回踩MA5/MA10附近观察，不追高；未触发不建仓"
      reduce_risk: "优先降低暴露，减仓后观察是否止跌"
      avoid_catching_falling_knife: "禁止抄底，等待站回短均线或RSI脱离超卖区"
      neutral_hold: "维持现有仓位，不主动调仓"
      no_data: "无数据支持，不形成任何观点"
    conflict_hints:
      suspend_accumulation: "当前风险状态暂停加仓，风险解除后再评估"
      risk_high: "当前风险状态为{level}，需先观察风险触发条件是否缓解"

  # ── 产品类型路由规则（quant_action 路由消费）──
  # mode: full=全执行 / fund=高门槛(T+2) / precious=价差产品 / info_only=只读 / skip=跳过
  product_type_rules:
    exchange_traded_fund: {mode: full}
    stock: {mode: full}
    short_treasury_etf: {mode: full}
    qdii_fund:
      mode: fund
      context: "场外 QDII，申赎 T+2，以收盘净值为准。止盈阈值 40%，止损阈值 -20%"
    feeder_fund:
      mode: fund
      context: "场外联接基金，申赎 T+2，以收盘净值为准。止盈阈值 40%，止损阈值 -20%"
    mixed_fund:
      mode: fund
      context: "主动管理混合基金，高浮盈后需关注基金经理风格漂移。止盈阈值 40%"
    fixed_income_plus_fund:
      mode: fund
      context: "固收+产品，波动率低。技术信号仅供参考，以资产配置逻辑为准"
    precious_metal_account:
      mode: precious
      context: "积存金/贵金属账户，买卖有价差，短线操作成本高"
    bank_wealth_management:
      mode: info_only
      context: "银行理财，有开放期限制，非开放期不可操作"
    money_market_fund: {mode: skip}
    cash: {mode: skip}
    cash_equivalent: {mode: skip}
    insurance_policy: {mode: skip}

  # ── 组合裁决常量（portfolio_adjudicator 消费）──
  adjudication:
    min_add_amount_cny: 800.0      # 单次加仓最小金额（低于此不建议操作）
    safety_buffer_ratio: 0.05      # 安全垫目标 = 组合总值 × 此比例

  # ── 情报代理/主题暴露映射（2026-08-22 从 config_loader 内置提级，唯一权威）──
  intel_signal_proxy:
