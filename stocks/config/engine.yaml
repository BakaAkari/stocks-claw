  # ── VIX 风险分层（_risk_evidence_keys / _market_regime 消费）──
  vix_levels:
    hedge: 35.0                    # VIX > 此值 → 对冲级风险证据
    reduce: 25.0                   # VIX > 此值 → 减层级 / risk_off
    watch: 20.0                    # VIX > 此值 → 观察级
    risk_on_below: 15.0            # VIX < 此值 → risk_on

risk_state:
  critical_ttl_minutes: 360
  hedge_independent_evidence: 2
  hedge_confirmations: 2
  deescalation_confirmations: 2
  state_path: .local/risk_state.json

logging:
