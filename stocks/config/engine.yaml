# stocks-claw 引擎配置
# 优先级：环境变量 > 本文件 > 代码默认值
# 嵌套环境变量使用双下划线，如 STOCKS_FETCHER__MAX_RETRIES=3

paths:
  # 配置目录，默认相对 stocks/ 包目录
  config_dir: null
  # 数据目录
  data_dir: null
  # 本地隐私数据目录（不提交 git）
  local_data_dir: null
  # 密钥目录
  secret_dir: null
  # 全局情报存储目录
  intelligence_dir: null

providers:
  # A 股行情 Provider
  tencent_a:
    enabled: true
  eastmoney_a:
    enabled: true
  # 美股/加密货币 Provider
  finnhub:
    enabled: true
  binance:
    enabled: true
  # 备用 Provider 映射：市场 -> [备用1, 备用2]
  fallback:
    a:
      - eastmoney_a
      - tencent_a
    # 当前无独立第二源；接入任务见 EXECUTION_PLAN D1-2。
    us: []
    crypto:
      - binance

fetcher:
  # 主 Provider 失败后的重试次数
  max_retries: 1
  # 重试间隔（秒）
  retry_delay: 1.0

cache:
  # 启用本地缓存
  enabled: true
  # 历史数据保留期（秒，90 天）
  history_ttl: 7776000
  # 历史缓存目录；默认写入 .local/history，避免污染源码目录
  history_dir: null
  # 保留最大快照数
  max_snapshots: 30
  # build_context 成功后保存最小化快照
  save_to_file: true

macro:
  # 启用宏观数据采集（FRED 主源 → Yahoo 备源 → static_config 兜底）
  enabled: true
  # 静态配置兜底（离线时使用）
  static_config:
    # vix: 20.0
    # usd_cny: 7.25
    # us_10y_yield: 4.2

calendar:
  # 启用官方宏观日程与 watchlist 美股财报日历
  enabled: true
  lookahead_days: 14
  earnings:
    enabled: true

filings:
  # 仅查询 watchlist：SEC 8-K/10-Q/10-K 与巨潮公告
  enabled: true
  sec:
    enabled: true
  cninfo:
    enabled: true

news:
  # 为 watchlist 动态生成 Google News RSS 定向源
  watchlist_templates_enabled: true

llm:
  # LLM 深度分析模块（投资建议生成）— 建议由 Agent 主脑处理，此处可禁用
  analysis_enabled: false
  analysis_model: kimi-k2.6
  # API Key 从环境变量读取，也可通过 .secret/openai-key.md
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL

logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR
  level: INFO
  # 脱敏：隐藏日志中的金额和 API Key
  desensitize: true
