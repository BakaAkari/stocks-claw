# stocks-claw 引擎配置
# 优先级：环境变量 > 本文件 > 代码默认值
# 环境变量格式：STOCKS_<section>_<key>，如 STOCKS_FETCHER_MAX_RETRIES=3

paths:
  # 配置目录，默认相对 stocks/ 包目录
  config_dir: null
  # 数据目录
  data_dir: null
  # 本地隐私数据目录（不提交 git）
  local_data_dir: null
  # 密钥目录
  secret_dir: null

providers:
  # A 股行情 Provider
  tencent_a:
    enabled: true
    timeout: 20
  eastmoney_a:
    enabled: true
    timeout: 20
  # 美股/加密货币 Provider
  finnhub:
    enabled: true
    timeout: 20
    api_key_env: FINNHUB_API_KEY
  # 备用 Provider 映射：市场 -> [备用1, 备用2]
  fallback:
    a:
      - eastmoney_a
      - tencent_a
    us:
      - finnhub

fetcher:
  # 主 Provider 失败后的重试次数
  max_retries: 1
  # 重试间隔（秒）
  retry_delay: 1.0

cache:
  # 启用本地缓存
  enabled: true
  # 行情缓存 TTL（秒）
  quote_ttl: 1800
  # 新闻缓存 TTL（秒）
  news_ttl: 7200
  # 历史数据缓存 TTL（秒）
  history_ttl: 86400
  # 历史缓存目录；默认写入 .local/history，避免污染源码目录
  history_dir: null
  # 保留最大快照数
  max_snapshots: 30

news_sources:
  # RSS 新闻源列表
  rss:
    - https://www.36kr.com/feed
  # 每个源最大获取条数
  max_source_items: 20

macro:
  # 启用宏观数据采集
  enabled: true
  # 静态配置兜底（离线时使用）
  static_config:
    # vix: 20.0
    # usd_cny: 7.25
    # us_10y_yield: 4.2

llm:
  # LLM 增强模块（新闻摘要、分级）
  enhancer_enabled: true
  enhancer_model: deepseek-v4-flash
  # LLM 深度分析模块（投资建议生成）— 建议由 Agent 主脑处理，此处可禁用
  analysis_enabled: false
  analysis_model: kimi-k2.6
  # 默认不在初始化时请求 /models，避免定时任务因代理鉴权/网络产生噪音
  validate_models: false
  # API Key 从环境变量读取，也可通过 .secret/openai-key.md
  api_key_env: OPENAI_API_KEY
  base_url_env: OPENAI_BASE_URL

logging:
  # 日志级别：DEBUG, INFO, WARNING, ERROR
  level: INFO
  # 脱敏：隐藏日志中的金额和 API Key
  desensitize: true
